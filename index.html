<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinted AI Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-sm py-4 px-6 sticky top-0 z-10">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-emerald-600">🛍️ Vinted AI Generator</h1>
            <button onclick="toggleSettings()" class="text-gray-500 text-sm bg-gray-100 px-3 py-1.5 rounded-full hover:bg-gray-200">API Ключ</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4 flex-grow w-full space-y-6">

        <!-- Settings Modal / Panel -->
        <div id="settingsPanel" class="hidden bg-white p-4 rounded-2xl shadow-sm border border-gray-100 space-y-3">
            <label class="block text-sm font-medium text-gray-700">Введи Gemini API Key:</label>
            <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="w-full p-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            <button onclick="saveApiKey()" class="w-full bg-emerald-600 text-white py-2 rounded-xl text-sm font-semibold hover:bg-emerald-700">Зберегти ключ</button>
        </div>

        <!-- 1. AI Photo Generation Section -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-4">
            <h2 class="font-semibold text-gray-800">1. Генерація фону для фото (AI)</h2>
            <div>
                <label class="block text-xs font-medium text-gray-500 mb-1">Вибери локацію або сцену:</label>
                <input type="text" id="locationInput" value="у Вроцлаві, стильний інтер'єр бутіка" placeholder="Наприклад: у Вроцлаві, на вулиці, у студії" class="w-full p-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>
            
            <button onclick="generateAiPhoto()" id="photoBtn" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-semibold shadow-sm hover:bg-indigo-700 transition flex items-center justify-center space-x-2 text-sm">
                <span>📸 Згенерувати фото через AI</span>
            </button>

            <!-- Photo Loader -->
            <div id="photoLoader" class="hidden text-center py-4">
                <div class="inline-block animate-spin rounded-full h-6 w-6 border-3 border-indigo-500 border-t-transparent"></div>
                <p class="text-xs text-gray-500 mt-1">AI створює фото...</p>
            </div>

            <!-- Generated Photo Preview -->
            <div id="generatedPhotoContainer" class="hidden space-y-3">
                <div class="relative aspect-square rounded-xl overflow-hidden border border-gray-200 bg-gray-100">
                    <img id="aiResultImage" src="" class="w-full h-full object-cover">
                </div>
                <div class="flex space-x-2">
                    <button onclick="generateAiPhoto()" class="flex-1 bg-gray-100 text-gray-700 py-2 rounded-xl text-xs font-semibold hover:bg-gray-200 transition">🔄 Інший варіант</button>
                    <a id="downloadPhotoBtn" download="vinted-ai-photo.jpg" target="_blank" class="flex-1 bg-emerald-50 text-emerald-700 py-2 rounded-xl text-xs font-semibold text-center hover:bg-emerald-100 transition flex items-center justify-center">💾 Завантажити</a>
                </div>
            </div>
        </div>

        <!-- 2. Listing Generator Section -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-4">
            <h2 class="font-semibold text-gray-800">2. Завантаж фото товару (до 6 шт.)</h2>
            
            <label class="flex flex-col items-center justify-center border-2 border-dashed border-gray-300 rounded-2xl p-5 cursor-pointer hover:border-emerald-500 bg-gray-50 transition">
                <span class="text-2xl mb-1">📂</span>
                <span class="text-sm font-medium text-gray-600">Обрати фото з галереї</span>
                <input type="file" id="imageInput" accept="image/*" multiple class="hidden" onchange="handleImages(event)">
            </label>

            <!-- Previews -->
            <div id="previewContainer" class="grid grid-cols-3 gap-2"></div>
        </div>

        <!-- Action Button -->
        <button onclick="generateListing()" id="generateBtn" class="w-full bg-emerald-600 text-white py-3.5 rounded-2xl font-semibold shadow-md hover:bg-emerald-700 transition flex items-center justify-center space-x-2">
            <span>✨ Згенерувати оголошення (PL)</span>
        </button>

        <!-- Listing Loader -->
        <div id="loader" class="hidden text-center py-6">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-emerald-500 border-t-transparent"></div>
            <p class="text-sm text-gray-500 mt-2">Gemini аналізує фото та пише опис...</p>
        </div>

        <!-- Result Section -->
        <div id="resultSection" class="hidden bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="font-semibold text-gray-800">3. Готове оголошення (PL)</h2>
                <button onclick="copyResult()" class="text-xs bg-emerald-50 text-emerald-700 font-medium px-3 py-1.5 rounded-lg hover:bg-emerald-100">Копіювати</button>
            </div>
            <textarea id="resultText" class="w-full h-64 p-3 border rounded-xl text-sm font-mono focus:ring-2 focus:ring-emerald-500 focus:outline-none"></textarea>
        </div>

    </main>

    <script>
        let selectedFiles = [];

        window.onload = () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            } else {
                document.getElementById('settingsPanel').classList.remove('hidden');
            }
        };

        function toggleSettings() {
            document.getElementById('settingsPanel').classList.toggle('hidden');
        }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                alert('Ключ успішно збережено!');
                document.getElementById('settingsPanel').classList.add('hidden');
            } else {
                alert('Введи дійсний ключ!');
            }
        }

        // AI Photo Generation logic
        function generateAiPhoto() {
            const location = document.getElementById('locationInput').value.trim() || 'у Вроцлаві';
            const loader = document.getElementById('photoLoader');
            const container = document.getElementById('generatedPhotoContainer');
            const btn = document.getElementById('photoBtn');

            loader.classList.remove('hidden');
            container.classList.add('hidden');
            btn.disabled = true;

            const prompt = encodeURIComponent(`Professional clean aesthetic clothing boutique interior background set ${location}, high quality, realistic, beautiful lighting, empty space for product, no random objects.`);
            const imageUrl = `https://image.pollinations.ai/prompt/${prompt}?width=1024&height=1024&nologo=true&seed=${Math.floor(Math.random() * 1000000)}`;

            const img = new Image();
            img.src = imageUrl;
            img.onload = () => {
                document.getElementById('aiResultImage').src = imageUrl;
                document.getElementById('downloadPhotoBtn').href = imageUrl;
                container.classList.remove('hidden');
                loader.classList.add('hidden');
                btn.disabled = false;
            };
            img.onerror = () => {
                alert('Не вдалося згенерувати фото. Спробуй ще раз.');
                loader.classList.add('hidden');
                btn.disabled = false;
            };
        }

        // Multiple images handling
        function handleImages(event) {
            const files = Array.from(event.target.files);
            if (selectedFiles.length + files.length > 6) {
                alert('Максимум можна завантажити 6 фотографій!');
                return;
            }

            selectedFiles = selectedFiles.concat(files);
            renderPreviews();
        }

        function renderPreviews() {
            const container = document.getElementById('previewContainer');
            container.innerHTML = '';
            selectedFiles.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const div = document.createElement('div');
                    div.className = 'relative aspect-square rounded-xl overflow-hidden border border-gray-200 bg-gray-100';
                    div.innerHTML = `
                        <img src="${e.target.result}" class="w-full h-full object-cover">
                        <button onclick="removeImage(${index})" class="absolute top-1 right-1 bg-black/60 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs">×</button>
                    `;
                    container.appendChild(div);
                };
                reader.readAsDataURL(file);
            });
        }

        function removeImage(index) {
            selectedFiles.splice(index, 1);
            renderPreviews();
        }

        async function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        // Listing generation logic (Gemini 1.5 Flash)
        async function generateListing() {
            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) {
                alert('Спочатку введи та збережи свій Gemini API ключ у налаштуваннях!');
                document.getElementById('settingsPanel').classList.remove('hidden');
                return;
            }

            if (selectedFiles.length === 0) {
                alert('Будь ласка, завантаж хоча б одне фото товару!');
                return;
            }

            const loader = document.getElementById('loader');
            const resultSection = document.getElementById('resultSection');
            const generateBtn = document.getElementById('generateBtn');

            loader.classList.remove('hidden');
            resultSection.classList.add('hidden');
            generateBtn.disabled = true;

            try {
                const imageParts = await Promise.all(selectedFiles.map(async (file) => {
                    const base64Data = await fileToBase64(file);
                    return {
                        inline_data: {
                            mime_type: file.type,
                            data: base64Data
                        }
                    };
                }));

                const prompt = "Jesteś profesjonalnym sprzedawcą na Vinted. Przeanalizuj te zdjęcia przedmiotu i stwórz gotowe, atrakcyjne ogłoszenie po polsku. Uwzględnij: 1. Chwytliwy tytuł (Tytuł), 2. Szczegółowy opis przedmiotu (stan, marka jeśli widoczna, materiał, kolor, wymiary lub sugerowany rozmiar), 3. Odpowiednie hashtagi na końcu. Pisz naturalnie, tak jak piszą użytkownicy Vinted.";

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: prompt },
                                ...imageParts
                            ]
                        }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    alert('Помилка від Gemini: ' + data.error.message);
                    return;
                }
                
                if (data.candidates && data.candidates[0].content) {
                    const text = data.candidates[0].content.parts.find(p => p.text)?.text || "Brak opisu";
                    document.getElementById('resultText').value = text;
                    resultSection.classList.remove('hidden');
                } else {
                    alert('Не вдалося отримати відповідь від Gemini. Перевір правильність API ключа.');
                }

            } catch (error) {
                console.error(error);
                alert('Сталася мережева помилка під час запиту.');
            } finally {
                loader.classList.add('hidden');
                generateBtn.disabled = false;
            }
        }

        function copyResult() {
            const textarea = document.getElementById('resultText');
            textarea.select();
            document.execCommand('copy');
            alert('Скопійовано в буфер обміну!');
        }
    </script>
</body>
</html>
